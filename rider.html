<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#e8590c">
<title>Mark LPG Services - Rider</title>
<style>
:root{--bg:#fff7f0;--card:#fff;--ink:#1f1a17;--mute:#6b5f57;--brand:#e8590c;--brand2:#c2410c;--line:#f0e0d2;--soft:#fff1e6;--shadow:0 6px 24px rgba(120,60,20,.08);--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe}
@media(prefers-color-scheme:dark){:root{--bg:#120d0a;--card:#1d1612;--ink:#f6ece4;--mute:#b9a99d;--brand:#ff8a3d;--brand2:#ff6a13;--line:#352820;--soft:#271c15;--shadow:0 6px 24px rgba(0,0,0,.4);--ok:#86efac;--okbg:#14351f;--warn:#fcd34d;--warnbg:#3a2d0c;--bad:#fca5a5;--badbg:#3f1818;--info:#93c5fd;--infobg:#15284a}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}button,input{font:inherit}svg{width:20px;height:20px;flex:none}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:12px;border:1.5px solid transparent;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.g{background:transparent;color:var(--brand);border-color:var(--brand)}.btn.d{background:transparent;color:var(--bad);border-color:var(--bad)}.btn.ok{background:var(--ok);color:#fff}
@media(prefers-color-scheme:dark){.btn.ok{color:#052e16}}
.btn.sm{height:38px;padding:0 12px;font-size:14px;border-radius:10px}.btn.full{width:100%}
/* login */
.lw{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 500px at 50% -10%,rgba(232,89,12,.18),transparent 60%),var(--bg)}
.lc{width:min(100%,400px);background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.lh{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:26px 24px;text-align:center}
.lh .ic{width:84px;height:84px;border-radius:24px;overflow:hidden;border:3px solid rgba(255,255,255,.75);box-shadow:0 8px 22px rgba(0,0,0,.22);margin:0 auto 12px;background:#fff}
.lh .ic img{width:100%;height:100%;object-fit:cover;display:block}
.lh h1{margin:0;font-size:22px}.lh p{margin:4px 0 0;font-size:14px;opacity:.92}
.lb{padding:22px 24px 24px}.fl{margin:0 0 14px}.fl label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
input[type=email],input[type=password],input[type=text]{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;outline:0}
input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(232,89,12,.16)}
.pw{position:relative}.pw input{padding-right:50px}
.eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.eye[aria-pressed=true],.eye:hover{color:var(--brand)}
.err{min-height:20px;color:var(--bad);font-weight:600;font-size:14px;margin:-2px 0 10px}
.hint{font-size:12px;color:var(--mute);margin:10px 0 0;text-align:center}
/* top */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:62px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.bi{width:40px;height:40px;border-radius:12px;overflow:hidden;border:2px solid var(--line);flex:none}.bi img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{display:block;font-size:16px;line-height:1.1}.brand small{color:var(--mute);font-size:12px}
main{padding:16px 0 40px}
h2{font-size:18px;margin:0 0 10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.oh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.oid{font-weight:800;font-size:16px}.ot{color:var(--mute);font-size:13px}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.t-av{background:var(--okbg);color:var(--ok)}.t-ot{background:var(--warnbg);color:var(--warn)}.t-me{background:var(--infobg);color:var(--info)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:14px}.kv .full{grid-column:1/-1}
.kv small{display:block;color:var(--mute);font-size:12px;font-weight:600}.kv span,.kv a{font-weight:600;word-break:break-word}.kv a{color:var(--brand);text-decoration:none}
.tot{font-size:20px;font-weight:800;color:var(--brand)}
.ra{display:flex;flex-wrap:wrap;gap:8px}
.empty{text-align:center;color:var(--mute);padding:44px 16px;background:var(--card);border:1px dashed var(--line);border-radius:18px}.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}
/* active */
.act{border:2px solid var(--brand)}
.live{display:flex;align-items:center;gap:10px;background:var(--okbg);color:var(--ok);padding:10px 14px;border-radius:14px;font-weight:800;margin-bottom:14px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(21,128,61,.6);animation:pulse 1.6s infinite;flex:none}
.live.warn{background:var(--warnbg);color:var(--warn)}.live.warn .dot{background:var(--warn);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(21,128,61,0)}100%{box-shadow:0 0 0 0 rgba(21,128,61,0)}}
.gps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.gps div{background:var(--soft);border-radius:12px;padding:10px 12px}.gps small{display:block;color:var(--mute);font-size:12px;font-weight:600}.gps b{font-size:16px}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);background:#1f1a17;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><link rel="manifest" href="manifest-rider.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mark LPG Rider">
<style>
#inst{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 8px));z-index:90;display:none;align-items:center;gap:6px}
#inst.show{display:flex;animation:instIn .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes instIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.38),rgba(255,138,61,.30));-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 32px rgba(232,89,12,.28),inset 0 1px 0 rgba(255,255,255,.6);color:#7a2e05}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .glass{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,138,61,.26));border-color:rgba(255,255,255,.22);color:#fff;box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}}
:root[data-theme="dark"] .glass{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,138,61,.26));border-color:rgba(255,255,255,.22);color:#fff}
#instBtn{display:flex;align-items:center;gap:8px;border-radius:999px;padding:11px 18px 11px 14px;font:700 15px system-ui,sans-serif;cursor:pointer}
#instBtn:active{transform:scale(.96)}
#instBtn svg{width:20px;height:20px;flex:none}
#instX{width:28px;height:28px;border-radius:50%;padding:0;cursor:pointer;font:700 14px/1 system-ui,sans-serif;display:grid;place-items:center}
#instHelp{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,360px);z-index:95;border-radius:22px;padding:18px;display:none;font:15px/1.5 system-ui,sans-serif}
#instHelp.show{display:block;animation:instIn .4s ease}
#instHelp b{font-size:17px}#instHelp ol{margin:8px 0 12px;padding-left:20px}#instHelp button{border-radius:999px;padding:8px 18px;font:700 14px system-ui,sans-serif;cursor:pointer}
@media(prefers-reduced-motion:reduce){#inst.show,#instHelp.show{animation:none}}
</style>
<style>#inst{right:auto;left:max(16px,env(safe-area-inset-left,0px))}</style>
<style>
#offb{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:95;padding:8px 16px;border-radius:999px;font:700 13px system-ui,sans-serif;white-space:nowrap}
</style>
<style>
.mkr{width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #e8590c;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.mkr.d{border-color:#15803d}.leaflet-container{font-family:inherit}
#rmap{height:300px;border-radius:14px;border:1px solid var(--line);margin:0 0 6px;z-index:0;background:var(--soft);display:grid;place-items:center;color:var(--mute)}
.rmw{margin:0 0 14px}
</style>
<style>
.sub{border-top:1px dashed var(--line);padding-top:14px;margin-top:14px}
.pick{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;min-height:44px;width:100%}
.pick input{width:22px;height:22px;accent-color:var(--brand);margin:0}
.btn.g.full{width:100%}
.ra .btn.full{flex:1 1 100%}
</style>
</head><body>

function nice(e){var n=String(e||"").split("@")[0].replace(/[._-]+/g," ").trim();return n.replace(/\b\w/g,function(c){return c.toUpperCase()})||"Rider"}
function km(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}

function start(){firebase.initializeApp(FIREBASE_CONFIG);au=firebase.auth();db=firebase.firestore();

}
function saveAct(){try{if(ACT.length)localStorage.setItem("rider_active",JSON.stringify(ACT));else localStorage.removeItem("rider_active")}catch(x){}}

function listen(){if(watching)return;watching=true;
 db.collection("orders").where("status","==","out for delivery").onSnapshot(function(q){ORD=[];q.forEach(function(s){ORD.push({id:s.id,d:s.data()})});
  ORD.sort(function(a,b){var x=a.d.createdAt?a.d.createdAt.toMillis():0,y=b.d.createdAt?b.d.createdAt.toMillis():0;return x-y});gotO=true;
  var gone=ACT.filter(function(id){return!ORD.some(function(o){return o.id===id})});if(gone.length)drop(gone,"A delivery is no longer out for delivery.");
  render()},function(){toast("Could not load deliveries. Ask the shop to check the Firestore rules.")});
 db.collection("tracking").onSnapshot(function(q){TRK={};q.forEach(function(s){TRK[s.id]=s.data()});gotT=true;
  if(ACT.length&&lastSent&&!sending&&Date.now()-lastSent>GAP*3){var rel=ACT.filter(function(id){return!TRK[id]});if(rel.length)drop(rel,"The shop released a delivery.")}
  render()},function(){});
}
function ago(ms){var s=Math.max(0,Math.round((Date.now()-ms)/1000));return s<60?s+"s ago":Math.round(s/60)+" min ago"}
function mapsLink(o){var d=o.d;return d.lat!=null&&d.lng!=null?"https://www.google.com/maps/dir/?api=1&destination="+d.lat+","+d.lng+"&travelmode=driving":"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(d.address||"")+"&travelmode=driving"}
function kv(l,node,full){var d=E("div",null,full?"full":"");d.append(E("small",l),node);return d}

function takenBy(o){var t=TRK[o.id];return t&&t.riderUid!==me.uid&&t.updatedAt&&(Date.now()-t.updatedAt.toMillis()<STALE)?t:null}
